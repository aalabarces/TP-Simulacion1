<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Fire Splash</title>
<link rel="stylesheet" href="css/estilos.css">
</head>
<body>

<!-- Lienzo donde se dibuja todo el juego -->
<canvas id="lienzo"></canvas>

<!-- Controles táctiles: solo se ven en celulares y tablets (ver controles-tactiles.js).
     data-mantener = se mantiene apretado · data-accion = un solo toque -->
<div id="controles-tactiles">
  <div class="grupo-tactil izquierda">
    <button data-mantener="izquierda" aria-label="Mover a la izquierda">◀</button>
    <button data-mantener="derecha" aria-label="Mover a la derecha">▶</button>
    <button data-mantener="saltar" class="saltar" aria-label="Saltar">⤒</button>
  </div>
  <div class="grupo-tactil derecha">
    <button data-accion="cambiarLlama" class="cambiar-llama" aria-label="Cambiar de llama">⇄</button>
    <div class="columna-angulo">
      <button data-mantener="arriba" aria-label="Subir el ángulo">▲</button>
      <button data-mantener="abajo" aria-label="Bajar el ángulo">▼</button>
    </div>
    <button data-mantener="cargar" class="disparar" aria-label="Disparar (mantener para cargar)">🔥</button>
  </div>
</div>
<div id="botones-menu">
  <button data-accion="aceptar" class="principal">Empezar</button>
  <button data-accion="menu" class="secundario">Menú</button>
</div>
<button id="boton-pantalla-completa" aria-label="Pantalla completa">⛶</button>
<div id="aviso-girar">📱↻<br>Girá el teléfono para jugar</div>

<!-- Panel de debug (se abre/cierra con la tecla P) -->
<div id="panel-debug" class="oculto">
  <h3>Debug · Fire Splash (P) · <span id="version-debug"></span></h3>
  <label class="casilla"><input type="checkbox" id="casilla-temperatura"> Vista temperatura (T)</label>
  <label class="casilla"><input type="checkbox" id="casilla-grilla"> Vista grilla / estados (G)</label>
  <div class="leyenda" id="leyenda"></div>
  <div class="estadisticas" id="estadisticas"></div>
  <h4>Parámetros</h4>
  <div id="contenedor-sliders"></div>
  <button id="boton-nuevo-mapa">Nuevo mapa (R)</button>
</div>

<!--
  Los scripts se cargan EN ORDEN: cada archivo usa lo que definieron los anteriores.
  No se usan módulos ES para que el juego funcione abriendo el HTML con doble clic (file://).
-->
<script src="js/configuracion.js"></script>   <!-- constantes, materiales y parámetros ajustables -->
<script src="js/utilidades.js"></script>      <!-- números aleatorios, ruido, colores -->
<script src="js/grilla.js"></script>          <!-- estado de la grilla (Euleriano) -->
<script src="js/generador-mapa.js"></script>  <!-- mapa procedural simétrico -->
<script src="js/temperatura.js"></script>     <!-- difusión de calor y cambios de estado -->
<script src="js/fluidos.js"></script>         <!-- autómata celular: agua y magma -->
<script src="js/particulas-agua.js"></script> <!-- agua en caída libre (Lagrangiano) -->
<script src="js/cascadas.js"></script>        <!-- cascadas laterales que llenan el lago (muerte súbita) -->
<script src="js/efectos.js"></script>         <!-- vapor, chispas, humo (solo visual) -->
<script src="js/viento.js"></script>          <!-- estelas que muestran el viento (solo visual) -->
<script src="js/llama.js"></script>           <!-- llamas (elementales): movimiento, daño, curación -->
<script src="js/proyectiles.js"></script>     <!-- bola de fuego, magma y explosiones -->
<script src="js/turnos.js"></script>          <!-- flujo de la partida -->
<script src="js/joystick.js"></script>        <!-- joysticks (Gamepad API) -->
<script src="js/entrada.js"></script>         <!-- teclado y unión con los joysticks -->
<script src="js/controles-tactiles.js"></script> <!-- botones en pantalla para celular -->
<script src="js/dibujo-personajes.js"></script> <!-- llama y fósforo dibujados por código -->
<script src="js/render.js"></script>          <!-- dibujo del mundo -->
<script src="js/camara.js"></script>        <!-- cámara: zoom, desplazamiento, seguimiento -->
<script src="js/hud.js"></script>            <!-- interfaz: vida, tiempo, viento, armas -->
<script src="js/debug.js"></script>           <!-- panel de debug y sliders -->
<script src="js/sonido.js"></script>          <!-- efectos de sonido sintetizados (Web Audio API) -->
<script src="js/principal.js"></script>       <!-- bucle principal del juego -->
</body>
</html>
